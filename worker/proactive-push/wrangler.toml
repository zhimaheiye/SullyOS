## Proactive Push Accelerator — Cloudflare Worker config (v2: 24/7 server-side AI)
##
## v2 变更：Worker cron 自身调 LLM 生成消息，不再依赖浏览器在线。
## 电脑关机也能发推送。

name = "proactive-push"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

## wrangler deploy 会用本地这份配置整体覆盖 Cloudflare 面板上的设置——
## 不显式写这段，面板里手动开的 Workers Logs（实时日志）会被一起关掉。
[observability]
enabled = true

[observability.logs]
enabled = true

## 部署前需要把下面 database_id 换成你 `wrangler d1 create proactive-db`
## 输出的真实 id。
[[d1_databases]]
binding = "DB"
database_name = "proactive-db"
database_id = "REPLACE_WITH_YOUR_D1_ID"

[triggers]
crons = ["* * * * *"]

[vars]
VAPID_SUBJECT = "mailto:replace-with-your-email@example.com"
CLIENT_TOKEN = ""
# ── LLM 配置（API URL 和模型名写在 vars，API Key 用 secret 设）──
LLM_API_URL = ""
LLM_MODEL = ""
