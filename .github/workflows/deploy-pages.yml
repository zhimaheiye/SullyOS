name: Deploy to GitHub Pages

on:
  # 公开版由维护者验证后手动发布。
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Finish deployment and save its history before the next release starts.
  cancel-in-progress: false

jobs:
  deploy:
    # main/master can both exist, but one production site must have one history.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GITHUB_PAGES: 'true'
      VITE_UMAMI_SCRIPT_URL: ''
      VITE_UMAMI_WEBSITE_ID: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Verify build asset retention
        run: node --test scripts/prepare-retained-build-assets.test.mjs

      # Keep previous hashed chunks reachable by tabs that are still running them.
      # Restore after build so historical files never enter the new SW manifest.
      - name: Restore previous build assets
        id: retained-assets
        uses: actions/cache/restore@v4
        with:
          path: .cache/retained-build-assets
          key: site-assets-pages-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: site-assets-pages-v1-${{ github.ref_name }}-

      - name: Retain recent hashed build assets
        run: node scripts/prepare-retained-build-assets.mjs --dist dist --history .cache/retained-build-assets

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Save deployed build assets
        uses: actions/cache/save@v4
        with:
          path: .cache/retained-build-assets
          key: ${{ steps.retained-assets.outputs.cache-primary-key }}
